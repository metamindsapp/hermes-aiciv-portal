name: Import pinned Hermes snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-hermes-pr.yml"

permissions:
  contents: write

concurrency:
  group: pinned-hermes-import
  cancel-in-progress: false

jobs:
  import:
    if: github.head_ref == 'bootstrap/pinned-hermes-import'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HERMES_UPSTREAM: https://github.com/NousResearch/hermes-agent.git
      HERMES_SHA: a726a4aee6dc6bd3bf42e32e51d391b60eb53aaf
      TARGET_BRANCH: bootstrap/pinned-hermes-import
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/pinned-hermes-import
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preserve AiCIV upstream metadata
        run: |
          mkdir -p /tmp/aiciv-preserve/.aiciv
          cp .aiciv/UPSTREAM.md /tmp/aiciv-preserve/.aiciv/UPSTREAM.md

      - name: Fetch exact Hermes commit
        run: |
          git remote remove hermes-upstream 2>/dev/null || true
          git remote add hermes-upstream "$HERMES_UPSTREAM"
          git fetch --depth=1 hermes-upstream "$HERMES_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$HERMES_SHA"

      - name: Prepare exact pinned Hermes tree
        run: |
          # Load the exact upstream tree into the index and worktree.
          git read-tree --reset -u FETCH_HEAD

          # Upstream currently contains Windows Alternate Data Stream metadata
          # paths named *:Zone.Identifier. They are not source/product content
          # and break downstream Git/worktree tooling. Exclude only those paths
          # and record every exclusion in the import receipt.
          python - <<'PY'
          from pathlib import Path
          import subprocess

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          removed = []
          for item in raw.split(b"\0"):
              if not item or b":Zone.Identifier" not in item:
                  continue
              path = item.decode("utf-8", errors="surrogateescape")
              subprocess.run(["git", "update-index", "--force-remove", "--", path], check=True)
              try:
                  Path(path).unlink()
              except FileNotFoundError:
                  pass
              removed.append(path)
          Path("/tmp/aiciv-excluded-ads.txt").write_text("\n".join(removed), encoding="utf-8")
          print(f"excluded {len(removed)} Windows ADS metadata path(s)")
          for path in removed:
              print(f"  - {path}")
          PY

          # The one-time importer intentionally does NOT survive into the
          # imported product tree. Only provenance/receipt metadata is added to
          # the exact Hermes snapshot.
          mkdir -p .aiciv
          cp /tmp/aiciv-preserve/.aiciv/UPSTREAM.md .aiciv/UPSTREAM.md

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import os

          excluded = [
              line for line in Path("/tmp/aiciv-excluded-ads.txt").read_text(encoding="utf-8").splitlines()
              if line
          ]
          receipt = {
              "upstream": "NousResearch/hermes-agent",
              "sha": os.environ["HERMES_SHA"],
              "imported_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "method": "pinned-git-tree-snapshot",
              "excluded_paths": excluded,
              "exclusion_reason": "Windows :Zone.Identifier ADS metadata only",
          }
          Path(".aiciv/IMPORT_RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git add -- .aiciv/UPSTREAM.md .aiciv/IMPORT_RECEIPT.json

          test -f LICENSE
          grep -q "MIT License" LICENSE
          grep -q "Copyright (c) 2025 Nous Research" LICENSE
          test -f web/package.json
          test -f web/src/App.tsx

      - name: Commit prepared index without worktree refresh
        run: |
          # Use Git plumbing deliberately. `git commit` refreshes/re-walks the
          # imported worktree and can choke on upstream platform-specific path
          # artifacts even after the index has been sanitized. write-tree and
          # commit-tree commit exactly the already-validated index.
          TREE_SHA="$(git write-tree)"
          PARENT_SHA="$(git rev-parse HEAD)"
          COMMIT_SHA="$(printf '%s\n' "chore: import Hermes upstream $HERMES_SHA" | git commit-tree "$TREE_SHA" -p "$PARENT_SHA")"

          echo "tree:   $TREE_SHA"
          echo "commit: $COMMIT_SHA"
          test -n "$COMMIT_SHA"

          git update-ref "refs/heads/$TARGET_BRANCH" "$COMMIT_SHA" "$PARENT_SHA"
          git push origin "$COMMIT_SHA:refs/heads/$TARGET_BRANCH"
