name: Import pinned Hermes snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-hermes-pr.yml"

permissions:
  contents: write

concurrency:
  group: pinned-hermes-import
  cancel-in-progress: false

jobs:
  import:
    if: github.head_ref == 'bootstrap/pinned-hermes-import'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HERMES_UPSTREAM: https://github.com/NousResearch/hermes-agent.git
      HERMES_SHA: a726a4aee6dc6bd3bf42e32e51d391b60eb53aaf
      TARGET_BRANCH: bootstrap/pinned-hermes-import
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/pinned-hermes-import
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preserve AiCIV import metadata
        run: |
          mkdir -p /tmp/aiciv-preserve/.aiciv /tmp/aiciv-preserve/.github/workflows
          cp .aiciv/UPSTREAM.md /tmp/aiciv-preserve/.aiciv/UPSTREAM.md
          cp .github/workflows/import-hermes-pr.yml /tmp/aiciv-preserve/.github/workflows/import-hermes-pr.yml

      - name: Fetch exact Hermes commit
        run: |
          git remote remove hermes-upstream 2>/dev/null || true
          git remote add hermes-upstream "$HERMES_UPSTREAM"
          git fetch --depth=1 hermes-upstream "$HERMES_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$HERMES_SHA"

      - name: Replace branch tree with pinned upstream snapshot
        run: |
          # read-tree loads the exact upstream tree into the index/worktree.
          git read-tree --reset -u FETCH_HEAD

          # Hermes upstream currently contains one or more Windows Alternate
          # Data Stream metadata artifacts named *:Zone.Identifier. They carry
          # no product/source content and can make generic index refreshes fail
          # on downstream tooling. Drop only those artifacts and record the
          # exclusion explicitly in the import receipt.
          python - <<'PY'
          from pathlib import Path
          import subprocess

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          removed = []
          for item in raw.split(b"\0"):
              if not item or b":Zone.Identifier" not in item:
                  continue
              path = item.decode("utf-8", errors="surrogateescape")
              subprocess.run(
                  ["git", "update-index", "--force-remove", "--", path],
                  check=True,
              )
              try:
                  Path(path).unlink()
              except FileNotFoundError:
                  pass
              removed.append(path)
          Path("/tmp/aiciv-excluded-ads.txt").write_text("\n".join(removed), encoding="utf-8")
          print(f"excluded {len(removed)} Windows ADS metadata path(s)")
          for path in removed:
              print(f"  - {path}")
          PY

          mkdir -p .aiciv .github/workflows
          cp /tmp/aiciv-preserve/.aiciv/UPSTREAM.md .aiciv/UPSTREAM.md
          cp /tmp/aiciv-preserve/.github/workflows/import-hermes-pr.yml .github/workflows/import-hermes-pr.yml

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import os

          excluded = [
              line for line in Path("/tmp/aiciv-excluded-ads.txt").read_text(encoding="utf-8").splitlines()
              if line
          ]
          receipt = {
              "upstream": "NousResearch/hermes-agent",
              "sha": os.environ["HERMES_SHA"],
              "imported_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "method": "pinned-git-tree-snapshot",
              "excluded_paths": excluded,
              "exclusion_reason": "Windows :Zone.Identifier ADS metadata only",
          }
          Path(".aiciv/IMPORT_RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          test -f LICENSE
          grep -q "MIT License" LICENSE
          grep -q "Copyright (c) 2025 Nous Research" LICENSE
          test -f web/package.json
          test -f web/src/App.tsx

      - name: Commit imported snapshot to bootstrap branch
        run: |
          # The upstream tree is already staged by read-tree. Add only our
          # restored metadata instead of running git add -A across the huge
          # index (which is what exposed the ADS path problem in attempt one).
          git add -- \
            .aiciv/UPSTREAM.md \
            .aiciv/IMPORT_RECEIPT.json \
            .github/workflows/import-hermes-pr.yml

          if git diff --cached --quiet; then
            echo "Pinned snapshot is already present."
            exit 0
          fi

          echo "staged files: $(git diff --cached --name-only | wc -l)"
          git commit -m "chore: import Hermes upstream $HERMES_SHA"
          git push origin HEAD:"$TARGET_BRANCH"
