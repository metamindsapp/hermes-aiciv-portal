name: Replay AiCIV product files onto Hermes baseline

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: replay-aiciv-product
  cancel-in-progress: false

jobs:
  replay:
    if: github.head_ref == 'agent/aiciv-product-layer-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiciv-product-layer-v2
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch source product branch
        run: git fetch origin agent/aiciv-product-layer:refs/remotes/origin/agent/aiciv-product-layer

      - name: Replay tested AiCIV product files
        run: |
          git checkout origin/agent/aiciv-product-layer -- \
            .aiciv/CORE_DELTAS.md \
            .aiciv/PORTAL_PARITY.md \
            aiciv/README.md \
            aiciv/install.py \
            aiciv/plugins/aiciv-workspace/README.md \
            aiciv/plugins/aiciv-workspace/dashboard/dist/aiciv.css \
            aiciv/plugins/aiciv-workspace/dashboard/dist/index.js \
            aiciv/plugins/aiciv-workspace/dashboard/manifest.json \
            aiciv/plugins/aiciv-workspace/dashboard/plugin_api.py \
            aiciv/scripts/brand_lint.py \
            aiciv/tests/__init__.py \
            aiciv/tests/test_brand_contract.py \
            aiciv/tests/test_workspace_plugin.py \
            aiciv/upstream/check.py \
            brand/BRAND_CONSTITUTION.md \
            brand/themes/aiciv-living-record.yaml

          git add -- \
            .aiciv/CORE_DELTAS.md \
            .aiciv/PORTAL_PARITY.md \
            aiciv \
            brand

          if git diff --cached --quiet; then
            echo "AiCIV product files already match source branch."
            exit 0
          fi

          git commit -m "feat: replay AiCIV product layer on pinned Hermes baseline"
          git push origin HEAD:agent/aiciv-product-layer-v2
